server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: gongcheng-assistant

  # ========== MySQL 数据源 ==========
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/gongcheng?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: "123456"

    # ========== Druid 连接池配置 ==========
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20
      filters: stat,wall
      connection-properties: druid.stat.mergeSql=true;druid.stat.slowSqlMillis=5000
      # Druid 监控面板
      stat-view-servlet:
        enabled: true
        url-pattern: /druid/*
        login-username: admin
        login-password: admin123
        allow: 127.0.0.1

# ========== MyBatis Plus 配置 ==========
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.gongcheng.assistant.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

# ========== 外部接口调用超时 ==========
api:
  query:
    connect-timeout: 10000
    read-timeout: 30000

# ========== 微信小程序 ==========
wx:
  appid: wx5bc16220b65b57ab
  secret: c63bca5fc7c22ca5d6559eed8501ff09

# ========== SpringDoc OpenAPI ==========
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

# ========== 日志 ==========
logging:
  level:
    com.gongcheng.assistant: INFO
    com.gongcheng.assistant.mapper: DEBUG
